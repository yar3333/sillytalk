name: Build and Publish to npm

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Builds run on tags (release + publish), PRs (CI) and manual dispatch.
# Branch pushes are intentionally not built — pushing a release with its tag
# triggers the tag run, which runs the same tests, so the same commit is never
# built twice and there is no ordering race between the two runs. (Dedupe by a
# shared concurrency group was the other attempt and it is racy: the branch run
# and the tag run cancel each other and the run that publishes can be the one
# that gets cancelled.)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Build
        run: npm run build

      - name: Package npm release
        run: node scripts/package-npm.mjs

      - name: Upload npm release artifact
        uses: actions/upload-artifact@v5
        with:
          name: npm-release
          path: release/sillytalk

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    environment: NPM

    # npm trusted publishing: the job exchanges this OIDC token for a short
    # publish right, so no NPM_TOKEN secret exists to leak. The package
    # "sillytalk" on npmjs.com has this repo, this workflow file and the NPM
    # environment registered as its trusted publisher.
    permissions:
      id-token: write
      contents: read

    steps:
      # The artifact the build job tested and packaged is what gets published —
      # publishing never rebuilds, so the release cannot drift from the tested tree.
      - name: Download npm release artifact
        uses: actions/download-artifact@v6
        with:
          name: npm-release
          path: release/sillytalk

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.x; the runner image can lag behind.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Dry-run pack (sanity check)
        working-directory: release/sillytalk
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing)
        working-directory: release/sillytalk
        run: npm publish --access public --provenance
